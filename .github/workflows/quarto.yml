name: run
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: pip install ipykernel nbclient matplotlib numpy PyMPDATA
      - run: quarto render mup1.ipynb --to pdf --execute 
      - uses: actions/upload-artifact@v7
        with:
          path: mup1.pdf
